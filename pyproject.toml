[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "market-radar"
version = "0.1.0"
description = "AI agent for Vietnamese stock market signal analysis, price-direction forecasting and paper trading."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "jinja2>=3.1",
    "lightgbm>=4.5",
    "numpy>=2.1",
    "pandas>=3.0",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.6",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
notebook = ["ipykernel>=7", "matplotlib>=3.10", "nbclient>=0.10",
            "nbconvert>=7.16"]

[project.scripts]
market-radar = "market_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_radar = ["report/templates/*.j2"]

[tool.ruff]
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
